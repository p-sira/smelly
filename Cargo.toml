[package]
name = "smelly"
version = "0.2.0"
edition = "2024"

authors = ["Sira Pornsiriprasert <code@psira.me>"]
documentation = "https://docs.rs/smelly"
homepage = "https://github.com/p-sira/smelly"
repository = "https://github.com/p-sira/smelly"
license = "BSD-3-Clause"

description = "Performant Kalman, Extended Kalman (EKF), Unscented Kalman (UKF), and particle filters."
keywords = ["kalman", "filter", "estimation", "tracking", "sensor-fusion"]
categories = ["algorithms", "mathematics", "no-std", "science", "simulation"]

include = ["/src", "/LICENSE"]

[dependencies]
getset = "0.1.7"
nalgebra = { version = "0.35", default-features = false, features = [
    "alloc",
    "libm",
] }

[dev-dependencies]
criterion = { version = "5.0.3", package = "codspeed-criterion-compat" }
kalman_filters = "1.0.1"
nalgebra = { version = "0.35", default-features = false, features = ["macros"] }

[[bench]]
name = "kalman"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "particle"
harness = false
